<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Mini-Game</title>
    <style>
        /* NoPixel 4.0 Style UI */
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            font-family: 'Roboto', sans-serif;
            user-select: none;
        }

        #game-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #game-ui {
            position: relative;
            width: 400px;
            background-color: rgba(22, 22, 22, 0.8);
            border-radius: 5px;
            padding: 20px;
            color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 165, 0, 0.5);
        }

        .success {
            border: 1px solid rgba(0, 255, 0, 0.8) !important;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5) !important;
        }

        .failure {
            border: 1px solid rgba(255, 0, 0, 0.8) !important;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5) !important;
        }

        #round-info {
            text-align: center;
            font-size: 18px;
            color: orange;
            margin-bottom: 20px;
        }

        #timer-bar {
            width: 100%;
            height: 5px;
            background-color: rgba(50, 50, 50, 0.8);
            margin-bottom: 20px;
            border-radius: 2px;
            overflow: hidden;
        }

        #timer-progress {
            height: 100%;
            width: 100%;
            background-color: orange;
            transition: width 0.1s linear;
        }

        #arrows-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .arrow {
            width: 60px;
            height: 60px;
            background-color: rgba(50, 50, 50, 0.9);
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #999;
            transition: all 0.2s ease;
        }

        .arrow.active {
            background-color: orange;
            color: white;
            transform: scale(1.1);
        }

        .arrow.success {
            background-color: rgba(0, 180, 0, 0.9);
            color: white;
            border: none;
            box-shadow: none;
        }

        .arrow.failure {
            background-color: rgba(180, 0, 0, 0.9);
            color: white;
            border: none;
            box-shadow: none;
        }

        .arrow i {
            font-size: 28px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="game-container">
        <div id="game-ui">
            <div id="round-info">Round: 1/5</div>
            <div id="timer-bar">
                <div id="timer-progress"></div>
            </div>
            <div id="arrows-container">
                <div class="arrow" data-direction="left"><i class="fas fa-arrow-left"></i></div>
                <div class="arrow" data-direction="up"><i class="fas fa-arrow-up"></i></div>
                <div class="arrow" data-direction="down"><i class="fas fa-arrow-down"></i></div>
                <div class="arrow" data-direction="right"><i class="fas fa-arrow-right"></i></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
// حالة اللعبة
const state = {
    active: false,
    round: 1,
    totalRounds: 5,
    sequence: [],
    timeLimit: 10000,
    timerInterval: null,
    timeStarted: 0
};

// عناصر الواجهة
const gameContainer = document.getElementById('game-container');
const gameUI = document.getElementById('game-ui');
const roundInfo = document.getElementById('round-info');
const timerProgress = document.getElementById('timer-progress');
const arrowsContainer = document.getElementById('arrows-container');
const arrows = document.querySelectorAll('.arrow');

// التهيئة
document.addEventListener('DOMContentLoaded', () => {
    // الاستماع للرسائل القادمة من العميل (Client)
    window.addEventListener('message', function(event) {
        const data = event.data;

        switch (data.action) {
            case 'initialize':
                // تهيئة واجهة المستخدم
                break;

            case 'startGame':
                // بدء اللعبة
                startGame(data);
                break;

            case 'stopGame':
                // إيقاف اللعبة
                stopGame();
                break;

            case 'updateRound':
                // تحديث معلومات الجولة
                updateRound(data);
                break;

            case 'highlightArrow':
                // تمييز السهم المضغوط
                highlightArrow(data.direction, data.success);
                break;

            case 'keyPressed':
                // تمييز السهم عند الضغط على الزر
                highlightArrow(data.direction);
                break;

            case 'gameOver':
                // نهاية اللعبة
                gameOver(data.success, data.reason);
                break;
        }
    });

    // مستمع أحداث لوحة المفاتيح
    document.addEventListener('keydown', function(event) {
        if (!state.active) return;

        let direction;
        switch (event.key) {
            case 'ArrowUp':
                direction = 'up'; // السهم لأعلى
                break;
            case 'ArrowDown':
                direction = 'down'; // السهم لأسفل
                break;
            case 'ArrowLeft':
                direction = 'left'; // السهم لليسار
                break;
            case 'ArrowRight':
                direction = 'right'; // السهم لليمين
                break;
            default:
                return;
        }

        event.preventDefault();

        // إرسال الأمر مباشرة إلى الكلاينت في لوا عن طريق NUI
        $.post(`https://${GetParentResourceName()}/arrowPressed`, JSON.stringify({
            direction: direction
        }));
    });
});

// بدء اللعبة
function startGame(data) {
    state.active = true;
    state.round = data.round;
    state.totalRounds = data.totalRounds;
    state.sequence = data.sequence;
    state.timeLimit = data.timeLimit;
    state.timeStarted = Date.now();

    console.log("بدء اللعبة بالتسلسل:", state.sequence);
    console.log("الحد الزمني:", state.timeLimit);

    // تحديث واجهة المستخدم
    gameContainer.style.display = 'flex';
    roundInfo.textContent = `Round: ${state.round}/${state.totalRounds}`;

    // بدء المؤقت
    startTimer();

    // عرض تسلسل الأسهم
    showSequence();
}

// إيقاف اللعبة
function stopGame() {
    state.active = false;
    clearInterval(state.timerInterval);
    gameContainer.style.display = 'none';

    // إعادة تعيين واجهة المستخدم
    resetArrows();
    gameUI.classList.remove('success', 'failure');
}

// تحديث معلومات الجولة
function updateRound(data) {
    state.round = data.round;
    state.totalRounds = data.totalRounds;
    state.sequence = data.sequence;
    state.timeStarted = Date.now();

    // تحديث واجهة المستخدم
    roundInfo.textContent = `Round: ${state.round}/${state.totalRounds}`;
    resetArrows();

    // إعادة تعيين المؤقت
    timerProgress.style.width = '100%';
    timerProgress.style.backgroundColor = 'orange';

    console.log(`بدء الجولة ${state.round} بالتسلسل:`, state.sequence);

    // عرض تسلسل الأسهم
    showSequence();
}

// تمييز السهم عند الضغط عليه
function highlightArrow(direction, success) {
    const arrow = document.querySelector(`.arrow[data-direction="${direction}"]`);
    if (arrow) {
        arrow.classList.add('active');
        if (success !== undefined) {
            arrow.classList.add(success ? 'success' : 'failure');
        }

        setTimeout(() => {
            arrow.classList.remove('active');
            if (success !== undefined) {
                arrow.classList.remove('success', 'failure');
            }
        }, 300);
    }
}

// نهاية اللعبة
function gameOver(success, reason) {
    clearInterval(state.timerInterval);

    console.log("نهاية اللعبة:", success ? "نجاح" : "فشل", reason ? `(${reason})` : "");

    // تحديث واجهة المستخدم
    gameUI.classList.add(success ? 'success' : 'failure');

    // عرض رسالة النتيجة
    if (success) {
        roundInfo.textContent = 'نجاح!';
        roundInfo.style.color = '#00FF00';
    } else {
        if (reason === 'timeout') {
            roundInfo.textContent = 'فشل - انتهى الوقت!';
        } else if (reason === 'wrong_sequence') {
            roundInfo.textContent = 'فشل - سهم خاطئ!';
        } else {
            roundInfo.textContent = 'فشل!';
        }
        roundInfo.style.color = '#FF0000';
    }

    // إغلاق اللعبة بعد تأخير
    setTimeout(() => {
        $.post(`https://${GetParentResourceName()}/gameClosed`, JSON.stringify({ success }));
        stopGame();
    }, 2000);
}

// عرض تسلسل الأسهم للاعب
function showSequence() {
    // اختياري: عرض تسلسل الأسهم للاعب بشكل مرئي
    resetArrows();

    console.log("عرض التسلسل:", state.sequence);

    // تمييز كل سهم بتأخير بين كل واحد
    state.sequence.forEach((direction, index) => {
        setTimeout(() => {
            const arrow = document.querySelector(`.arrow[data-direction="${direction}"]`);
            if (arrow) {
                arrow.classList.add('active');
                setTimeout(() => {
                    arrow.classList.remove('active');
                }, 300);
            }
        }, index * 600); // تأخير بين الأسهم لظهورها بوضوح
    });
}

// بدء المؤقت الزمني
function startTimer() {
    clearInterval(state.timerInterval);
    timerProgress.style.width = '100%';

    state.timerInterval = setInterval(() => {
        const elapsed = Date.now() - state.timeStarted;
        const remaining = Math.max(0, state.timeLimit - elapsed);
        const percentage = (remaining / state.timeLimit) * 100;

        timerProgress.style.width = `${percentage}%`;

        // تغيير اللون حسب الوقت المتبقي
        if (percentage < 20) {
            timerProgress.style.backgroundColor = '#FF3333';
        } else if (percentage < 50) {
            timerProgress.style.backgroundColor = '#FFCC33';
        } else {
            timerProgress.style.backgroundColor = 'orange';
        }

        if (remaining <= 0) {
            clearInterval(state.timerInterval);
        }
    }, 100);
}

// إعادة تعيين الأسهم لحالتها الأصلية
function resetArrows() {
    arrows.forEach(arrow => {
        arrow.classList.remove('active', 'success', 'failure');
    });
}

// دالة للحصول على اسم المورد (resource name)
function GetParentResourceName() {
    return 'Y98_arrow'; // يجب أن يتطابق مع اسم المورد الخاص بك
}

    </script>
</body>
</html>
